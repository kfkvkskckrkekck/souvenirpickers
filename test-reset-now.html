<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 3px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #output {
      margin-top: 20px;
      padding: 20px;
      background: #dbeafe;
      border: 3px solid #3b82f6;
      border-radius: 10px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 500px;
      overflow-y: auto;
      color: #1e40af;
    }
    .success { background: #d1fae5; border-color: #10b981; color: #065f46; }
    .error { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .loading { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Password Reset Diagnostic</h1>
    <p class="subtitle">Click to test and see the actual error from the server</p>

    <input
      type="email"
      id="email"
      placeholder="Enter email address"
      value="test@example.com"
    />

    <button id="testBtn" onclick="testReset()">🚀 TEST PASSWORD RESET</button>

    <div id="output">✓ Page loaded - ready to test
✓ Click the button above
✓ This will show you the EXACT error</div>
  </div>

  <script>
    async function testReset() {
      const email = document.getElementById('email').value.trim();
      const output = document.getElementById('output');
      const btn = document.getElementById('testBtn');

      if (!email) {
        alert('Please enter an email');
        return;
      }

      output.textContent = '';
      output.className = 'loading';
      btn.disabled = true;

      const log = (msg) => output.textContent += msg + '\n';

      try {
        log('═══════════════════════════════════════════════════════');
        log('🔍 PASSWORD RESET TEST');
        log('═══════════════════════════════════════════════════════');
        log('');
        log(`📧 Email: ${email}`);
        log('');

        const supabaseUrl = 'https://pynvqvlqecpxxrgmvdfy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bnZxdmxxZWNweHhyZ212ZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg3MzQ0ODUsImV4cCI6MjA0NDMxMDQ4NX0.TxL-1c3Sxv7ZMWQ5oWwZ0RumBAW5sZFT9ePnXxKCqEo';
        const functionUrl = `${supabaseUrl}/functions/v1/send-password-reset`;

        log(`🌐 Calling: ${functionUrl}`);
        log('📤 Sending request...');
        log('');

        const start = Date.now();

        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseKey}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: 'https://souvenirpickers.com/reset-password',
          }),
        });

        const elapsed = Date.now() - start;

        log(`⏱️  Completed in ${elapsed}ms`);
        log(`📊 HTTP ${response.status} ${response.statusText}`);
        log('');

        const text = await response.text();
        log('📦 RAW RESPONSE:');
        log('─────────────────────────────────────────────────────');
        log(text);
        log('─────────────────────────────────────────────────────');
        log('');

        let data;
        try {
          data = JSON.parse(text);
          log('📋 PARSED:');
          log(JSON.stringify(data, null, 2));
        } catch (e) {
          log('⚠️  Not valid JSON');
          data = { error: text };
        }

        log('');

        if (response.ok && data.success) {
          log('═══════════════════════════════════════════════════════');
          log('✅ SUCCESS!');
          log('═══════════════════════════════════════════════════════');
          log('');
          log(`✓ Email sent to: ${email}`);
          log('✓ Check inbox (and spam folder)');
          output.className = 'success';
        } else {
          log('═══════════════════════════════════════════════════════');
          log('❌ ERROR');
          log('═══════════════════════════════════════════════════════');
          log('');
          log(`🔴 ${data.error || 'Unknown error'}`);
          if (data.details) log(`📝 ${data.details}`);
          log('');
          log('→ Copy this output and send to developer');
          output.className = 'error';
        }

      } catch (error) {
        log('');
        log('═══════════════════════════════════════════════════════');
        log('💥 NETWORK ERROR');
        log('═══════════════════════════════════════════════════════');
        log('');
        log(`${error.message}`);
        output.className = 'error';
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
