<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Auth Diagnostic - SouvenirPickers</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }
    .section h2 {
      color: #333;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
    }
    .status.success { background: #10b981; color: white; }
    .status.error { background: #ef4444; color: white; }
    .status.warning { background: #f59e0b; color: white; }
    .status.info { background: #3b82f6; color: white; }
    pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      margin-right: 10px;
      margin-top: 10px;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:active { transform: translateY(0); }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      transform: none;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
      font-size: 14px;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #f3f4f6;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .test-grid {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }
    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .alert.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .alert.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .alert.warning {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }
    .config-check {
      display: flex;
      align-items: center;
      padding: 10px;
      margin: 5px 0;
      background: white;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
    }
    .config-check .icon {
      margin-right: 10px;
      font-size: 20px;
    }
    .config-check .text {
      flex: 1;
      font-size: 14px;
    }
    .test-result {
      margin-top: 10px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Complete Authentication Diagnostic</h1>
    <p class="subtitle">Comprehensive testing for SouvenirPickers authentication system</p>

    <div id="configStatus"></div>

    <!-- Configuration Check Section -->
    <div class="section">
      <h2>
        <span>⚙️ Configuration Check</span>
        <span id="configBadge" class="status info">Checking...</span>
      </h2>
      <div id="configResults"></div>
    </div>

    <!-- Sign Up Test Section -->
    <div class="section">
      <h2>
        <span>📝 Sign Up Test</span>
        <span id="signupBadge" class="status info">Ready</span>
      </h2>
      <div class="input-group">
        <label for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" placeholder="test@example.com" value="test-${Date.now()}@example.com">
      </div>
      <div class="input-group">
        <label for="signupPassword">Password (min 6 characters)</label>
        <input type="password" id="signupPassword" placeholder="Password123" value="TestPass123!">
      </div>
      <div class="input-group">
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="John Doe" value="Test User">
      </div>
      <button onclick="testSignUp()" id="signupBtn">🚀 Test Sign Up</button>
      <button onclick="testSignUpRaw()" id="signupRawBtn">🔬 Test Raw API</button>
      <div id="signupResult"></div>
    </div>

    <!-- Sign In Test Section -->
    <div class="section">
      <h2>
        <span>🔐 Sign In Test</span>
        <span id="signinBadge" class="status info">Ready</span>
      </h2>
      <div class="input-group">
        <label for="signinEmail">Email Address</label>
        <input type="email" id="signinEmail" placeholder="existing@example.com">
      </div>
      <div class="input-group">
        <label for="signinPassword">Password</label>
        <input type="password" id="signinPassword" placeholder="Your password">
      </div>
      <button onclick="testSignIn()" id="signinBtn">🔓 Test Sign In</button>
      <button onclick="testSignInRaw()" id="signinRawBtn">🔬 Test Raw API</button>
      <div id="signinResult"></div>
    </div>

    <!-- Database Trigger Test Section -->
    <div class="section">
      <h2>
        <span>🗄️ Database Trigger Test</span>
        <span id="triggerBadge" class="status info">Ready</span>
      </h2>
      <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
        Test if profile creation trigger is working correctly
      </p>
      <button onclick="checkDatabaseTrigger()" id="triggerBtn">🔍 Check Trigger Status</button>
      <div id="triggerResult"></div>
    </div>

    <!-- Current Session Section -->
    <div class="section">
      <h2>
        <span>👤 Current Session</span>
        <span id="sessionBadge" class="status info">Checking...</span>
      </h2>
      <button onclick="checkSession()">🔄 Refresh Session</button>
      <button onclick="clearSession()">🗑️ Clear Session</button>
      <div id="sessionResult"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    // Check configuration on load
    window.addEventListener('load', () => {
      checkConfiguration();
      checkSession();
    });

    function checkConfiguration() {
      const results = [];
      let allGood = true;

      // Check Supabase URL
      if (SUPABASE_URL && SUPABASE_URL.includes('bfqvzxczmvfteqbhgyvx')) {
        results.push({
          icon: '✅',
          text: 'Supabase URL is correctly configured',
          status: 'success'
        });
      } else {
        results.push({
          icon: '❌',
          text: 'Supabase URL is incorrect or missing',
          status: 'error'
        });
        allGood = false;
      }

      // Check Anon Key
      if (SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.length > 100) {
        results.push({
          icon: '✅',
          text: 'Supabase Anon Key is present',
          status: 'success'
        });
      } else {
        results.push({
          icon: '❌',
          text: 'Supabase Anon Key is missing or invalid',
          status: 'error'
        });
        allGood = false;
      }

      // Check client creation
      if (supabase) {
        results.push({
          icon: '✅',
          text: 'Supabase client initialized successfully',
          status: 'success'
        });
      } else {
        results.push({
          icon: '❌',
          text: 'Failed to initialize Supabase client',
          status: 'error'
        });
        allGood = false;
      }

      // Render results
      const container = document.getElementById('configResults');
      container.innerHTML = results.map(r => `
        <div class="config-check">
          <span class="icon">${r.icon}</span>
          <span class="text">${r.text}</span>
        </div>
      `).join('');

      const badge = document.getElementById('configBadge');
      badge.textContent = allGood ? 'All Good' : 'Issues Found';
      badge.className = `status ${allGood ? 'success' : 'error'}`;
    }

    async function testSignUp() {
      const btn = document.getElementById('signupBtn');
      const badge = document.getElementById('signupBadge');
      const resultDiv = document.getElementById('signupResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Testing...';
      badge.textContent = 'Testing...';
      badge.className = 'status info';

      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const fullName = document.getElementById('signupName').value;

      try {
        console.log('🚀 Starting sign up test...');
        console.log('Email:', email);
        console.log('Password length:', password.length);
        console.log('Full name:', fullName);

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.origin,
            data: {
              full_name: fullName,
              user_type: 'client'
            }
          }
        });

        console.log('Response data:', data);
        console.log('Response error:', error);

        if (error) {
          throw error;
        }

        const result = {
          success: true,
          user: data.user,
          session: data.session,
          confirmationRequired: !data.session
        };

        resultDiv.innerHTML = `
          <div class="alert success">
            <strong>✅ Sign Up Successful!</strong><br>
            User ID: ${data.user?.id || 'N/A'}<br>
            Email: ${data.user?.email || 'N/A'}<br>
            ${data.session ? '✅ Session created (auto-confirmed)' : '⚠️ Email confirmation required'}
          </div>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;

        badge.textContent = 'Success';
        badge.className = 'status success';

        // If session exists, check if profile was created
        if (data.session && data.user) {
          setTimeout(() => checkProfileCreated(data.user.id), 2000);
        }

      } catch (error) {
        console.error('❌ Sign up error:', error);

        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Sign Up Failed</strong><br>
            Error: ${error.message}<br>
            ${error.status ? `Status: ${error.status}<br>` : ''}
            ${error.code ? `Code: ${error.code}` : ''}
          </div>
          <pre>${JSON.stringify(error, null, 2)}</pre>
        `;

        badge.textContent = 'Failed';
        badge.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🚀 Test Sign Up';
      }
    }

    async function testSignUpRaw() {
      const btn = document.getElementById('signupRawBtn');
      const resultDiv = document.getElementById('signupResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Testing...';

      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({
            email,
            password,
            data: {
              full_name: document.getElementById('signupName').value,
              user_type: 'client'
            }
          })
        });

        const data = await response.json();

        resultDiv.innerHTML = `
          <div class="alert ${response.ok ? 'success' : 'error'}">
            <strong>${response.ok ? '✅' : '❌'} Raw API Response</strong><br>
            Status: ${response.status} ${response.statusText}<br>
            ${response.ok ? 'Sign up request accepted' : 'Sign up failed'}
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;

      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Raw API Test Failed</strong><br>
            ${error.message}
          </div>
        `;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔬 Test Raw API';
      }
    }

    async function testSignIn() {
      const btn = document.getElementById('signinBtn');
      const badge = document.getElementById('signinBadge');
      const resultDiv = document.getElementById('signinResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Testing...';
      badge.textContent = 'Testing...';
      badge.className = 'status info';

      const email = document.getElementById('signinEmail').value;
      const password = document.getElementById('signinPassword').value;

      try {
        console.log('🔐 Starting sign in test...');
        console.log('Email:', email);

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        console.log('Response data:', data);
        console.log('Response error:', error);

        if (error) {
          throw error;
        }

        resultDiv.innerHTML = `
          <div class="alert success">
            <strong>✅ Sign In Successful!</strong><br>
            User ID: ${data.user?.id || 'N/A'}<br>
            Email: ${data.user?.email || 'N/A'}<br>
            Session expires: ${new Date(data.session?.expires_at * 1000).toLocaleString()}
          </div>
          <pre>${JSON.stringify({ user: data.user, session: data.session }, null, 2)}</pre>
        `;

        badge.textContent = 'Success';
        badge.className = 'status success';

        // Check profile
        if (data.user) {
          setTimeout(() => checkProfileCreated(data.user.id), 1000);
        }

      } catch (error) {
        console.error('❌ Sign in error:', error);

        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Sign In Failed</strong><br>
            Error: ${error.message}<br>
            ${error.status ? `Status: ${error.status}<br>` : ''}
            ${error.code ? `Code: ${error.code}` : ''}
          </div>
          <pre>${JSON.stringify(error, null, 2)}</pre>
        `;

        badge.textContent = 'Failed';
        badge.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔓 Test Sign In';
      }
    }

    async function testSignInRaw() {
      const btn = document.getElementById('signinRawBtn');
      const resultDiv = document.getElementById('signinResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Testing...';

      const email = document.getElementById('signinEmail').value;
      const password = document.getElementById('signinPassword').value;

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        resultDiv.innerHTML = `
          <div class="alert ${response.ok ? 'success' : 'error'}">
            <strong>${response.ok ? '✅' : '❌'} Raw API Response</strong><br>
            Status: ${response.status} ${response.statusText}<br>
            ${response.ok ? 'Sign in successful' : 'Sign in failed'}
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;

      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Raw API Test Failed</strong><br>
            ${error.message}
          </div>
        `;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔬 Test Raw API';
      }
    }

    async function checkProfileCreated(userId) {
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', userId)
          .maybeSingle();

        if (error) {
          console.error('Profile check error:', error);
          return;
        }

        if (data) {
          console.log('✅ Profile exists:', data);
          alert('✅ Profile created successfully!\n\nUser type: ' + data.user_type + '\nFull name: ' + data.full_name);
        } else {
          console.warn('⚠️ No profile found for user');
          alert('⚠️ User created but profile not found.\n\nThis might indicate an issue with the database trigger.');
        }
      } catch (error) {
        console.error('Profile check failed:', error);
      }
    }

    async function checkDatabaseTrigger() {
      const btn = document.getElementById('triggerBtn');
      const badge = document.getElementById('triggerBadge');
      const resultDiv = document.getElementById('triggerResult');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Checking...';
      badge.textContent = 'Checking...';
      badge.className = 'status info';

      try {
        // Check if the trigger exists
        const { data, error } = await supabase.rpc('version');

        if (error) {
          throw new Error('Cannot connect to database');
        }

        resultDiv.innerHTML = `
          <div class="alert success">
            <strong>✅ Database Connection OK</strong><br>
            The database is accessible. To fully test the trigger, sign up with a new account.
          </div>
          <div class="test-result">
            <strong>Trigger Function:</strong> create_profile_for_new_user()<br>
            <strong>Expected behavior:</strong> Automatically creates a profile when a user confirms their email
          </div>
        `;

        badge.textContent = 'Connected';
        badge.className = 'status success';

      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Database Connection Failed</strong><br>
            ${error.message}
          </div>
        `;

        badge.textContent = 'Failed';
        badge.className = 'status error';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔍 Check Trigger Status';
      }
    }

    async function checkSession() {
      const badge = document.getElementById('sessionBadge');
      const resultDiv = document.getElementById('sessionResult');

      badge.textContent = 'Checking...';
      badge.className = 'status info';

      try {
        const { data: { session }, error } = await supabase.auth.getSession();

        if (error) {
          throw error;
        }

        if (session) {
          resultDiv.innerHTML = `
            <div class="alert success">
              <strong>✅ Active Session Found</strong>
            </div>
            <div class="test-result">
              <strong>User ID:</strong> ${session.user.id}<br>
              <strong>Email:</strong> ${session.user.email}<br>
              <strong>Expires:</strong> ${new Date(session.expires_at * 1000).toLocaleString()}<br>
              <strong>Created:</strong> ${new Date(session.user.created_at).toLocaleString()}
            </div>
          `;

          badge.textContent = 'Active';
          badge.className = 'status success';
        } else {
          resultDiv.innerHTML = `
            <div class="alert warning">
              <strong>⚠️ No Active Session</strong><br>
              You are not currently signed in.
            </div>
          `;

          badge.textContent = 'No Session';
          badge.className = 'status warning';
        }

      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert error">
            <strong>❌ Session Check Failed</strong><br>
            ${error.message}
          </div>
        `;

        badge.textContent = 'Error';
        badge.className = 'status error';
      }
    }

    async function clearSession() {
      try {
        await supabase.auth.signOut();
        alert('✅ Session cleared successfully');
        checkSession();
      } catch (error) {
        alert('❌ Failed to clear session: ' + error.message);
      }
    }

    // Log all auth state changes
    supabase.auth.onAuthStateChange((event, session) => {
      console.log('🔔 Auth state changed:', event);
      console.log('Session:', session);
    });
  </script>
</body>
</html>
