<!DOCTYPE html>
<html>
<head>
  <title>Quick Signup Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; padding: 40px; background: #f0f0f0; }
    .box { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: 0 auto; }
    button { width: 100%; padding: 15px; background: #6366f1; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin: 10px 0; }
    button:hover { background: #4f46e5; }
    .result { margin-top: 20px; padding: 15px; border-radius: 5px; font-size: 14px; }
    .error { background: #fee; color: #900; border: 2px solid #fcc; }
    .success { background: #efe; color: #060; border: 2px solid #cfc; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔍 Quick Signup Test</h1>
    <p>Click the button below to test signup:</p>
    <button onclick="test()">🚀 TEST SIGNUP NOW</button>
    <div id="result"></div>
  </div>

  <script>
    const supabase = window.supabase.createClient(
      'https://bfqvzxczmvfteqbhgyvx.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0'
    );

    async function test() {
      const result = document.getElementById('result');
      result.innerHTML = 'Testing...';

      const testEmail = 'test' + Date.now() + '@example.com';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: testEmail,
          password: 'test123456'
        });

        if (error) {
          result.className = 'result error';
          result.innerHTML = `
            <strong>❌ ERROR FOUND!</strong><br><br>
            <strong>Message:</strong> ${error.message}<br>
            <strong>Status:</strong> ${error.status || 'N/A'}<br><br>
            <strong>📋 COPY THIS ERROR AND SEND TO SUPPORT</strong><br>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          `;
        } else {
          result.className = 'result success';
          result.innerHTML = `
            <strong>✅ SIGNUP WORKS!</strong><br><br>
            Email: ${data.user.email}<br>
            ID: ${data.user.id}<br>
            Session: ${data.session ? 'Active' : 'None'}
          `;
        }
      } catch (err) {
        result.className = 'result error';
        result.innerHTML = `
          <strong>❌ CRITICAL ERROR!</strong><br><br>
          ${err.message}<br><br>
          <strong>📋 COPY THIS AND SEND TO SUPPORT</strong><br>
          <pre>${err.stack}</pre>
        `;
      }
    }
  </script>
</body>
</html>
