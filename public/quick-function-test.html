<!DOCTYPE html>
<html>
<head>
  <title>Quick Function Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #0f0;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #000;
      border: 2px solid #0f0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>🔥 Direct Function Test</h1>
  <button onclick="testFunction()">Test send-password-reset Function</button>
  <div id="result" class="result"></div>

  <script>
    async function testFunction() {
      const result = document.getElementById('result');
      result.textContent = 'Testing...\n\n';

      const url = 'https://bfqvzxczmvfteqbhgyvx.supabase.co/functions/v1/send-password-reset';
      const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMyNDc2ODcsImV4cCI6MjA0ODgyMzY4N30.GzCdHjV_LKHFEWJkN_yYbvxhYFoROSz3w0qH3dEPyWo';

      try {
        result.textContent += `URL: ${url}\n\n`;

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({
            email: 'test@example.com',
            redirectTo: window.location.origin
          })
        });

        result.textContent += `Status: ${response.status} ${response.statusText}\n\n`;

        const data = await response.json();
        result.textContent += `Response:\n${JSON.stringify(data, null, 2)}\n\n`;

        if (response.ok) {
          result.textContent += '✅ FUNCTION EXISTS AND IS WORKING!\n';
          result.textContent += 'The dashboard display is just a UI bug.\n';
        } else {
          result.textContent += '❌ Function returned an error\n';
        }
      } catch (err) {
        result.textContent += `❌ ERROR: ${err.message}\n`;
        result.textContent += `\nThis could mean:\n`;
        result.textContent += `1. Function doesn't exist\n`;
        result.textContent += `2. Network/CORS issue\n`;
        result.textContent += `3. Wrong project URL\n`;
      }
    }
  </script>
</body>
</html>
