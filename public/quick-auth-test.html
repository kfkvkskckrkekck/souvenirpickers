<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Auth Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f8f9fa;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin: 10px 0;
      font-weight: 500;
    }
    .success { background: #dcfce7; color: #15803d; border: 2px solid #22c55e; }
    .error { background: #fee2e2; color: #991b1b; border: 2px solid #ef4444; }
    .info { background: #dbeafe; color: #1e40af; border: 2px solid #3b82f6; }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 2px solid #e5e7eb;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Quick Auth Test</h1>
    <p style="color: #64748b; margin-bottom: 20px;">Test authentication with your configured Supabase setup</p>

    <div id="status"></div>

    <div>
      <input type="email" id="email" placeholder="test@example.com" value="test@example.com">
      <input type="password" id="password" placeholder="password123" value="Test123456!">
      <input type="text" id="fullName" placeholder="Full Name" value="Test User">

      <button onclick="testSignUp()">🎯 Test Sign Up</button>
      <button onclick="testSignIn()">🔑 Test Sign In</button>
      <button onclick="checkSession()">👤 Check Session</button>
      <button onclick="clearLogs()">🗑️ Clear Logs</button>
    </div>

    <div id="logs"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function log(message, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const statusDiv = document.getElementById('status');

      const logEntry = document.createElement('pre');
      logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.appendChild(logEntry);

      statusDiv.innerHTML = `<div class="${type}">${message}</div>`;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      document.getElementById('status').innerHTML = '';
    }

    async function testSignUp() {
      clearLogs();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;

      log('🔄 Testing sign up...', 'info');
      log(`Email: ${email}`, 'info');

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: window.location.origin,
            data: {
              full_name: fullName,
              user_type: 'client',
            },
          },
        });

        if (error) {
          log(`❌ Error: ${error.message}`, 'error');
          log(`Status: ${error.status}`, 'error');
          log(`Full error: ${JSON.stringify(error, null, 2)}`, 'error');
          return;
        }

        if (data.user && !data.session) {
          log('✅ Sign up successful!', 'success');
          log('📧 Email confirmation required', 'info');
          log('Check your email for confirmation link', 'info');
          log(`User ID: ${data.user.id}`, 'info');
          log(`Email confirmed: ${data.user.email_confirmed_at ? 'Yes' : 'No'}`, 'info');
        } else if (data.user && data.session) {
          log('✅ Sign up successful!', 'success');
          log('🎉 User is automatically signed in (email confirmation disabled)', 'success');
          log(`User ID: ${data.user.id}`, 'info');
          log(`Session active`, 'info');
        }

      } catch (err) {
        log(`❌ Unexpected error: ${err.message}`, 'error');
        console.error('Full error:', err);
      }
    }

    async function testSignIn() {
      clearLogs();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      log('🔄 Testing sign in...', 'info');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          log(`❌ Error: ${error.message}`, 'error');
          log(`Status: ${error.status}`, 'error');

          if (error.message.includes('Email not confirmed')) {
            log('📧 Email confirmation required. Check your email!', 'info');
          }
          return;
        }

        log('✅ Sign in successful!', 'success');
        log(`User ID: ${data.user.id}`, 'info');
        log(`Email: ${data.user.email}`, 'info');
        log(`Session active`, 'success');

      } catch (err) {
        log(`❌ Unexpected error: ${err.message}`, 'error');
        console.error('Full error:', err);
      }
    }

    async function checkSession() {
      clearLogs();
      log('🔄 Checking current session...', 'info');

      try {
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          log(`❌ Error: ${error.message}`, 'error');
          return;
        }

        if (data.session) {
          log('✅ Active session found!', 'success');
          log(`User: ${data.session.user.email}`, 'info');
          log(`User ID: ${data.session.user.id}`, 'info');
          log(`Expires: ${new Date(data.session.expires_at * 1000).toLocaleString()}`, 'info');
        } else {
          log('ℹ️ No active session', 'info');
          log('User is not signed in', 'info');
        }

      } catch (err) {
        log(`❌ Unexpected error: ${err.message}`, 'error');
        console.error('Full error:', err);
      }
    }

    // Auto-check session on load
    window.addEventListener('load', () => {
      checkSession();
    });
  </script>
</body>
</html>
