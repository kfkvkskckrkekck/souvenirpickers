<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Diagnostic Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 700px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .log-container {
      margin-top: 30px;
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      max-height: 400px;
      overflow-y: auto;
    }

    .log-title {
      font-weight: 600;
      margin-bottom: 15px;
      color: #333;
      font-size: 18px;
    }

    .log-entry {
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-info {
      background: #e3f2fd;
      border-left: 4px solid #2196f3;
      color: #0d47a1;
    }

    .log-success {
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
      color: #1b5e20;
    }

    .log-error {
      background: #ffebee;
      border-left: 4px solid #f44336;
      color: #b71c1c;
    }

    .log-warning {
      background: #fff3e0;
      border-left: 4px solid #ff9800;
      color: #e65100;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Password Reset Diagnostic Test</h1>
    <p class="subtitle">This tool will help diagnose email delivery issues</p>

    <form id="testForm">
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          required
        >
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">Send Test Password Reset</span>
      </button>
    </form>

    <div class="log-container">
      <div class="log-title">📋 Diagnostic Logs:</div>
      <div id="logs"></div>
    </div>
  </div>

  <script>
    const logsContainer = document.getElementById('logs');
    const form = document.getElementById('testForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    function addLog(message, type = 'info') {
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry log-${type}`;
      const timestamp = new Date().toLocaleTimeString();
      logEntry.textContent = `[${timestamp}] ${message}`;
      logsContainer.appendChild(logEntry);
      logsContainer.scrollTop = logsContainer.scrollHeight;
    }

    function clearLogs() {
      logsContainer.innerHTML = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();

      if (!email) {
        addLog('❌ Email is required', 'error');
        return;
      }

      // Clear previous logs
      clearLogs();

      // Disable button
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Testing...';

      addLog('🚀 Starting password reset test...', 'info');
      addLog(`📧 Email: ${email}`, 'info');

      try {
        const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMyNDc2ODcsImV4cCI6MjA0ODgyMzY4N30.GzCdHjV_LKHFEWJkN_yYbvxhYFoROSz3w0qH3dEPyWo';
        const redirectUrl = window.location.origin;
        const functionUrl = `${supabaseUrl}/functions/v1/send-password-reset`;

        addLog(`🌐 Function URL: ${functionUrl}`, 'info');
        addLog(`🔗 Redirect URL: ${redirectUrl}`, 'info');
        addLog('📤 Sending request to edge function...', 'info');

        const startTime = Date.now();

        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseKey}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: redirectUrl,
          }),
        });

        const duration = Date.now() - startTime;
        addLog(`⏱️ Response received in ${duration}ms`, 'info');
        addLog(`📊 Status Code: ${response.status}`, response.ok ? 'success' : 'error');
        addLog(`📊 Status Text: ${response.statusText}`, response.ok ? 'success' : 'error');

        // Log response headers
        addLog('📋 Response Headers:', 'info');
        response.headers.forEach((value, key) => {
          addLog(`  ${key}: ${value}`, 'info');
        });

        const data = await response.json();
        addLog(`📦 Response Body: ${JSON.stringify(data, null, 2)}`, response.ok ? 'success' : 'error');

        if (response.ok) {
          addLog('✅ SUCCESS! Password reset email should be sent.', 'success');
          addLog('', 'info');
          addLog('📬 CHECK YOUR EMAIL NOW:', 'warning');
          addLog('  1️⃣ Check your INBOX first', 'warning');
          addLog('  2️⃣ Check your SPAM/JUNK folder', 'warning');
          addLog('  3️⃣ Check ALL folders in your email client', 'warning');
          addLog('  4️⃣ Wait 2-3 minutes for delivery', 'warning');
          addLog('', 'info');
          addLog('🔍 Email Details:', 'info');
          addLog(`  From: support@pickersjourney.com`, 'info');
          addLog(`  To: ${email}`, 'info');
          addLog(`  Subject: Reset Your Password - SouvenirPickers`, 'info');
        } else {
          addLog('❌ ERROR: Request failed', 'error');
          addLog(`Error message: ${data.error || 'Unknown error'}`, 'error');

          if (response.status === 404) {
            addLog('⚠️ Edge function not found. The function may not be deployed.', 'error');
          } else if (response.status === 401) {
            addLog('⚠️ Authentication error. Invalid API key.', 'error');
          } else if (response.status === 500) {
            addLog('⚠️ Server error. Check edge function logs in Supabase dashboard.', 'error');
          }
        }

      } catch (err) {
        addLog(`❌ EXCEPTION: ${err.message}`, 'error');
        addLog(`Stack: ${err.stack}`, 'error');
        addLog('', 'info');
        addLog('🔍 Troubleshooting:', 'warning');
        addLog('  • Check your internet connection', 'warning');
        addLog('  • Verify Supabase project is accessible', 'warning');
        addLog('  • Check browser console for CORS errors', 'warning');
        addLog('  • Ensure edge function is deployed', 'warning');
      } finally {
        // Re-enable button
        submitBtn.disabled = false;
        btnText.textContent = 'Send Test Password Reset';
      }
    });

    // Initial log
    addLog('👋 Ready to test password reset functionality', 'info');
    addLog('Enter your email and click "Send Test Password Reset"', 'info');
  </script>
</body>
</html>
