<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Diagnostic Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .success {
      background: #d4edda;
      border: 2px solid #28a745;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border: 2px solid #dc3545;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border: 2px solid #17a2b8;
      color: #0c5460;
    }
    .log-entry {
      padding: 8px;
      margin: 4px 0;
      background: #f8f9fa;
      border-left: 3px solid #667eea;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .step {
      font-weight: 600;
      color: #667eea;
    }
    .timestamp {
      color: #999;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Password Reset Diagnostic</h1>
    <p class="subtitle">This tool will test your password reset system and show detailed logs</p>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >
    </div>

    <button id="testBtn" onclick="testPasswordReset()">
      🚀 Test Password Reset
    </button>

    <div id="logs"></div>
  </div>

  <script>
    const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMyNDc2ODcsImV4cCI6MjA0ODgyMzY4N30.GzCdHjV_LKHFEWJkN_yYbvxhYFoROSz3w0qH3dEPyWo';

    function addLog(message, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const timestamp = new Date().toLocaleTimeString();

      const logEntry = document.createElement('div');
      logEntry.className = `result ${type}`;
      logEntry.innerHTML = `
        <div class="timestamp">${timestamp}</div>
        <div>${message}</div>
      `;

      logsDiv.appendChild(logEntry);
      logEntry.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function testPasswordReset() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('testBtn');
      const logsDiv = document.getElementById('logs');

      if (!email) {
        addLog('❌ Please enter an email address', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Testing...';
      logsDiv.innerHTML = '';

      try {
        addLog('🔄 <span class="step">STEP 1:</span> Preparing request...', 'info');
        addLog(`📧 Target email: ${email}`, 'info');

        const requestBody = {
          email: email,
          redirectTo: `${window.location.origin}/reset-password`
        };

        addLog(`🌐 <span class="step">STEP 2:</span> Sending request to edge function...`, 'info');
        addLog(`Endpoint: ${supabaseUrl}/functions/v1/send-password-reset`, 'info');

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 30000);

        const startTime = Date.now();

        const response = await fetch(`${supabaseUrl}/functions/v1/send-password-reset`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseKey}`,
          },
          body: JSON.stringify(requestBody),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);
        const duration = Date.now() - startTime;

        addLog(`⏱️ Response received in ${duration}ms`, 'info');
        addLog(`📊 <span class="step">STEP 3:</span> Status Code: ${response.status} ${response.statusText}`, 'info');

        const data = await response.json();

        addLog('📦 <span class="step">STEP 4:</span> Response Data:', 'info');
        addLog(JSON.stringify(data, null, 2), 'info');

        if (!response.ok) {
          addLog(`❌ <strong>ERROR:</strong> ${data.error || data.details || 'Request failed'}`, 'error');

          if (data.details && data.details.includes('SMTP')) {
            addLog(`
🔧 <strong>SOLUTION:</strong> SMTP Configuration Missing!

Your edge function needs SMTP secrets configured in Supabase:

1. Go to: https://supabase.com/dashboard/project/bfqvzxczmvfteqbhgyvx/settings/functions
2. Add these secrets:
   - SMTP_HOST = mail.pickersjourney.com
   - SMTP_PORT = 587
   - SMTP_USER = support@pickersjourney.com
   - SMTP_PASS = Laur197511$
   - SMTP_FROM = support@pickersjourney.com
3. Save and test again
            `.trim(), 'error');
          }

          return;
        }

        addLog(`✅ <strong>SUCCESS!</strong> Password reset email sent successfully!`, 'success');
        addLog(`
📬 <strong>Next Steps:</strong>
1. Check your email inbox for: ${email}
2. Check your spam/junk folder
3. Click the reset link in the email
4. The link expires in 1 hour

Message ID: ${data.messageId || 'N/A'}
        `.trim(), 'success');

      } catch (err) {
        console.error('Full error:', err);

        if (err.name === 'AbortError') {
          addLog('❌ Request timed out after 30 seconds', 'error');
          addLog(`
🔧 <strong>POSSIBLE CAUSES:</strong>
- Edge function is not responding
- SMTP configuration is incorrect
- Network connectivity issues

Try checking the Supabase function logs for more details.
          `.trim(), 'error');
        } else {
          addLog(`❌ <strong>ERROR:</strong> ${err.message}`, 'error');
          addLog(`Full error: ${err.toString()}`, 'error');
        }
      } finally {
        btn.disabled = false;
        btn.textContent = '🚀 Test Password Reset';
      }
    }

    // Allow Enter key to submit
    document.getElementById('email').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        testPasswordReset();
      }
    });
  </script>
</body>
</html>
