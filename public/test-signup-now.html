<!DOCTYPE html>
<html>
<head>
  <title>Emergency Signup Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial; padding: 40px; max-width: 600px; margin: 0 auto; }
    input { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; }
    button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; font-size: 18px; cursor: pointer; margin: 8px 0; }
    button:hover { background: #059669; }
    .result { padding: 20px; margin: 20px 0; border-radius: 8px; white-space: pre-wrap; }
    .success { background: #d1fae5; color: #065f46; }
    .error { background: #fee2e2; color: #991b1b; }
    h1 { color: #1f2937; }
  </style>
</head>
<body>
  <h1>🚀 Emergency Signup Test</h1>
  <p>This will test signup WITHOUT email confirmation.</p>

  <input type="email" id="email" placeholder="Enter test email (e.g., test@test.com)">
  <input type="password" id="password" placeholder="Enter password (min 6 chars)">
  <button onclick="testSignup()">SIGN UP NOW</button>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function testSignup() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const resultDiv = document.getElementById('result');

      if (!email || !password) {
        resultDiv.innerHTML = '<div class="error">Please enter both email and password!</div>';
        return;
      }

      if (password.length < 6) {
        resultDiv.innerHTML = '<div class="error">Password must be at least 6 characters!</div>';
        return;
      }

      resultDiv.innerHTML = '<div>⏳ Creating account...</div>';

      try {
        const { data, error } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            emailRedirectTo: window.location.origin
          }
        });

        if (error) {
          resultDiv.innerHTML = `<div class="error"><strong>❌ SIGNUP FAILED:</strong>\n\n${error.message}\n\nError Code: ${error.status}\n\n<strong>WHAT TO DO:</strong>\n1. Go to Supabase Dashboard\n2. Navigate to: Authentication > Providers\n3. Click on "Email"\n4. Disable "Confirm email" toggle\n5. Save and try again</div>`;
        } else if (data.user && data.user.email_confirmed_at) {
          resultDiv.innerHTML = `<div class="success"><strong>✅ SUCCESS! Account created!</strong>\n\nEmail: ${data.user.email}\nUser ID: ${data.user.id}\nStatus: Email confirmed automatically\n\nYou can now log in!</div>`;
        } else if (data.user) {
          resultDiv.innerHTML = `<div class="error"><strong>⚠️ Account created BUT email needs confirmation</strong>\n\nUser ID: ${data.user.id}\nEmail: ${data.user.email}\n\nThis means email confirmation is STILL ENABLED in Supabase.\n\nYou MUST disable it:\n1. Go to Supabase Dashboard\n2. Authentication > Providers > Email\n3. Turn OFF "Confirm email"\n4. Save</div>`;
        } else {
          resultDiv.innerHTML = `<div class="error"><strong>⚠️ Unexpected response</strong>\n\n${JSON.stringify(data, null, 2)}</div>`;
        }
      } catch (err) {
        resultDiv.innerHTML = `<div class="error"><strong>❌ CRITICAL ERROR:</strong>\n\n${err.message}\n\n${err.stack}</div>`;
      }
    }
  </script>
</body>
</html>
