<!DOCTYPE html>
<html>
<head>
    <title>Complete Account Deletion</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Complete Account Deletion</h1>
    <div id="status"></div>

    <script>
        const supabase = window.supabase.createClient(
            'https://atdtxkijznyzrrxsovwz.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0ZHR4a2lqem55enJyeHNvdnd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQxMzMwNTYsImV4cCI6MjA1OTcwOTA1Nn0.0YFCPv7awKpvvVJZf_-9iHR43aGafn3nGPDl-DdHnaw'
        );

        async function deleteCompleteAccount() {
            const status = document.getElementById('status');

            try {
                // Get current user
                const { data: { user } } = await supabase.auth.getUser();

                if (!user) {
                    status.innerHTML = '<p style="color: red;">No user logged in</p>';
                    return;
                }

                status.innerHTML = `<p>Found user: ${user.email} (ID: ${user.id})</p><p>Deleting all data...</p>`;

                // Call edge function to delete everything
                const { data, error } = await supabase.functions.invoke('delete-user-account', {
                    body: { user_id: user.id }
                });

                if (error) {
                    status.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
                    console.error('Delete error:', error);
                } else {
                    const dataStr = JSON.stringify(data);
                    status.innerHTML += `<p style="color: green;">Account deleted: ${dataStr}</p>`;

                    // Sign out
                    await supabase.auth.signOut();
                    status.innerHTML += `<p style="color: green;">Signed out. You can now sign up as a new user!</p>`;
                }

            } catch (err) {
                status.innerHTML += `<p style="color: red;">Exception: ${err.message}</p>`;
                console.error('Exception:', err);
            }
        }

        // Run on load
        deleteCompleteAccount();
    </script>
</body>
</html>
