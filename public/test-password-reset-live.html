<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Diagnostic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }
    h1 { color: #333; margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .step {
      margin: 15px 0;
      padding: 15px;
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      border-radius: 4px;
    }
    .step.success { border-left-color: #28a745; background: #d4edda; }
    .step.error { border-left-color: #dc3545; background: #f8d7da; }
    .step-title { font-weight: 600; margin-bottom: 8px; color: #333; }
    .step-result { color: #666; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Password Reset Diagnostic</h1>
    <p class="subtitle">Test your password reset system and identify issues</p>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email address" required />
      </div>
      <button type="submit" id="submitBtn">
        <span id="btnText">Send Password Reset Email</span>
      </button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

    const form = document.getElementById('resetForm');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      resultDiv.innerHTML = '';
      submitBtn.disabled = true;
      btnText.innerHTML = '<span class="loading"></span> Testing...';

      try {
        addStep('Step 1: Testing Edge Function', 'Checking if function is accessible...', 'info');

        const functionUrl = `${SUPABASE_URL}/functions/v1/send-password-reset-email`;
        const startTime = Date.now();
        
        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: `${window.location.origin}/reset-password`,
          }),
        });

        const responseTime = Date.now() - startTime;
        const data = await response.json();

        updateStep('Step 1: Testing Edge Function',
          `✓ Edge function responded in ${responseTime}ms\nStatus: ${response.status} ${response.statusText}`,
          response.ok ? 'success' : 'error'
        );

        addStep('Step 2: Response Analysis',
          `Response:\n${JSON.stringify(data, null, 2)}`,
          response.ok ? 'success' : 'error'
        );

        if (!response.ok) {
          if (data.error?.includes('SMTP')) {
            addStep('Step 3: Issue Identified',
              '❌ SMTP Configuration Missing\n\nThe SMTP settings are not configured in Supabase.\n\nTo fix this:\n1. Go to Supabase Dashboard\n2. Navigate to Edge Functions > send-password-reset-email\n3. Add these secrets:\n   - SMTP_HOST\n   - SMTP_PORT\n   - SMTP_USER\n   - SMTP_PASS\n   - SMTP_FROM\n\n4. Redeploy the function',
              'error'
            );
          } else {
            addStep('Step 3: Issue Identified',
              `❌ Error: ${data.error}`,
              'error'
            );
          }
        } else {
          addStep('Step 3: Success!',
            `✓ Password reset email sent!\n\nCheck ${email} for the reset link.\n\nNote: Check spam folder if not received.`,
            'success'
          );
        }
      } catch (err) {
        addStep('Connection Error',
          `❌ Failed: ${err.message}`,
          'error'
        );
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Send Password Reset Email';
      }
    });

    function addStep(title, message, type = 'info') {
      const step = document.createElement('div');
      step.className = `step ${type}`;
      step.id = `step-${Date.now()}`;
      step.innerHTML = `
        <div class="step-title">${title}</div>
        <div class="step-result">${message}</div>
      `;
      resultDiv.appendChild(step);
    }

    function updateStep(title, message, type = 'info') {
      const steps = resultDiv.querySelectorAll('.step');
      for (const step of steps) {
        if (step.querySelector('.step-title').textContent === title) {
          step.className = `step ${type}`;
          step.querySelector('.step-result').textContent = message;
          return;
        }
      }
      addStep(title, message, type);
    }
  </script>
</body>
</html>
