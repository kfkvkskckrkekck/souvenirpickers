<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Element Test</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        #card-element {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            min-height: 44px;
        }
        #card-errors {
            color: #e74c3c;
            margin-top: 10px;
            font-size: 14px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0052a3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #bee5eb;
        }
        .info strong {
            display: block;
            margin-bottom: 5px;
        }
        .debug {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
        }
        .debug-line {
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Stripe Element Test</h1>

        <div class="info">
            <strong>Test Instructions:</strong>
            1. Enter your name below<br>
            2. Click in the "Card Information" field<br>
            3. Try typing - you should see a blinking cursor<br>
            4. If the field is locked/disabled, there's a Stripe account issue
        </div>

        <form id="payment-form">
            <div class="form-group">
                <label for="cardholder-name">Cardholder Name</label>
                <input type="text" id="cardholder-name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="card-element">Card Information</label>
                <div id="card-element"></div>
                <div id="card-errors" role="alert"></div>
            </div>

            <button type="submit" id="submit-button">Test Card Element</button>
        </form>

        <div id="success-message" class="status success">
            ✓ Success! The card element is working properly.
        </div>

        <div id="error-message" class="status error"></div>

        <div class="debug" id="debug-log">
            <strong>Debug Log:</strong><br>
        </div>
    </div>

    <script>
        const STRIPE_KEY = 'pk_live_51SI5wQFlPbAiVNx2hO266AapZfZLrCQZZOShtSjw3X4U0A7VyzRgMSBEx81psE24t7rnAU4CQVQc3uFoEniyFe4g00HbtBusTH';

        function log(message) {
            const debugLog = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            debugLog.innerHTML += `<div class="debug-line">[${time}] ${message}</div>`;
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message);
        }

        log('Starting Stripe initialization...');
        log(`Using key: ${STRIPE_KEY.substring(0, 20)}...`);

        // Initialize Stripe
        const stripe = Stripe(STRIPE_KEY);
        log('✓ Stripe instance created');

        const elements = stripe.elements();
        log('✓ Elements instance created');

        // Create card element
        const cardElement = elements.create('card', {
            hidePostalCode: true,
            disabled: false,
            style: {
                base: {
                    fontSize: '16px',
                    color: '#32325d',
                    fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                    '::placeholder': {
                        color: '#aab7c4'
                    }
                },
                invalid: {
                    color: '#e74c3c',
                    iconColor: '#e74c3c'
                }
            }
        });
        log('✓ Card element created');

        // Mount the card element
        cardElement.mount('#card-element');
        log('✓ Card element mounted to DOM');

        // Event listeners
        cardElement.on('ready', () => {
            log('✓ READY - Card element is ready for input!');
        });

        cardElement.on('focus', () => {
            log('→ FOCUS - User clicked in the field');
        });

        cardElement.on('blur', () => {
            log('← BLUR - User left the field');
        });

        cardElement.on('change', (event) => {
            const displayError = document.getElementById('card-errors');
            if (event.error) {
                displayError.textContent = event.error.message;
                log(`⚠ ERROR: ${event.error.message}`);
            } else {
                displayError.textContent = '';
                if (event.complete) {
                    log('✓ Card details are complete and valid!');
                } else if (event.empty) {
                    log('→ Card field is empty');
                } else {
                    log('→ User is typing...');
                }
            }
        });

        // Form submission
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            log('Attempting to create payment method...');
            const cardholderName = document.getElementById('cardholder-name').value;

            const {paymentMethod, error} = await stripe.createPaymentMethod({
                type: 'card',
                card: cardElement,
                billing_details: {
                    name: cardholderName
                }
            });

            if (error) {
                log(`✗ ERROR: ${error.message}`);
                document.getElementById('error-message').textContent = error.message;
                document.getElementById('error-message').style.display = 'block';
            } else {
                log(`✓ SUCCESS! Payment method created: ${paymentMethod.id}`);
                document.getElementById('success-message').style.display = 'block';
            }
        });

        log('='.repeat(50));
        log('Setup complete. Now try clicking in the Card Information field.');
        log('If you see a lock icon, your Stripe account may need activation.');
    </script>
</body>
</html>
