<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Status Check</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .status-box {
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border-left: 5px solid;
    }
    .success {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .error {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }
    .info {
      background: #d1ecf1;
      border-color: #17a2b8;
      color: #0c5460;
    }
    .warning {
      background: #fff3cd;
      border-color: #ffc107;
      color: #856404;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 10px 5px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      margin: 10px 0;
      box-sizing: border-box;
    }
    .form-group {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #555;
    }
    pre {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
    }
    .button-group {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Account Status Diagnostic</h1>

    <div id="results"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" value="lpopescu197511@gmail.com">
    </div>

    <div class="form-group">
      <label>Password (for sign-in test)</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>

    <div class="button-group">
      <button onclick="checkAccount()">Check Account Status</button>
      <button onclick="trySignIn()">Try Sign In</button>
      <button onclick="resetPassword()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">Send Password Reset</button>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.U9TctUC7P02kA-XdLEIb5NvPaHSQoMLmLQ0Sy3wdfvg';
    const { createClient } = supabase;
    const supabaseClient = createClient(supabaseUrl, supabaseKey);

    function showResult(message, type = 'info') {
      const resultsDiv = document.getElementById('results');
      const div = document.createElement('div');
      div.className = `status-box ${type}`;
      div.innerHTML = message;
      resultsDiv.appendChild(div);
    }

    function clearResults() {
      document.getElementById('results').innerHTML = '';
    }

    async function checkAccount() {
      clearResults();
      const email = document.getElementById('email').value;

      if (!email) {
        showResult('❌ Please enter an email address', 'error');
        return;
      }

      showResult('🔍 Checking account status...', 'info');

      try {
        // Check if profile exists
        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('email', email)
          .maybeSingle();

        if (profileError) {
          showResult(`❌ Error checking profile: ${profileError.message}`, 'error');
          return;
        }

        if (profile) {
          showResult(`✅ <strong>Account Found!</strong><br><br>
            <strong>User ID:</strong> ${profile.id}<br>
            <strong>Full Name:</strong> ${profile.full_name || 'Not set'}<br>
            <strong>User Type:</strong> ${profile.user_type}<br>
            <strong>Created:</strong> ${new Date(profile.created_at).toLocaleString()}<br><br>
            <strong>✨ Your account exists! Try signing in with your password.</strong>`, 'success');

          // Check picker profile if user is a picker
          if (profile.user_type === 'picker') {
            const { data: pickerProfile } = await supabaseClient
              .from('picker_profiles')
              .select('*')
              .eq('user_id', profile.id)
              .maybeSingle();

            if (pickerProfile) {
              const isEmpty = !pickerProfile.current_location &&
                            (!pickerProfile.regions || pickerProfile.regions.length === 0) &&
                            (!pickerProfile.specialties || pickerProfile.specialties.length === 0);

              if (isEmpty) {
                showResult(`⚠️ <strong>Profile Data Empty</strong><br><br>
                  Your picker profile exists but needs to be set up. After signing in:<br>
                  1. Go to Profile Settings<br>
                  2. Fill in your location and specialties<br>
                  3. Set up your payout information`, 'warning');
              } else {
                showResult(`✅ Picker profile configured with location and specialties`, 'success');
              }
            }

            // Check payout info
            const { data: payoutInfo } = await supabaseClient
              .from('picker_payout_info')
              .select('*')
              .eq('picker_id', profile.id)
              .maybeSingle();

            if (!payoutInfo) {
              showResult(`⚠️ <strong>Payout Info Missing</strong><br><br>
                After signing in, go to Profile Settings to set up your bank account details.`, 'warning');
            } else {
              showResult(`✅ Payout information configured`, 'success');
            }
          }
        } else {
          showResult(`❌ <strong>No Account Found</strong><br><br>
            No account exists with email: ${email}<br><br>
            You can create a new account with this email.`, 'error');
        }
      } catch (error) {
        showResult(`❌ Error: ${error.message}`, 'error');
      }
    }

    async function trySignIn() {
      clearResults();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showResult('❌ Please enter both email and password', 'error');
        return;
      }

      showResult('🔐 Attempting to sign in...', 'info');

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          showResult(`❌ <strong>Sign In Failed</strong><br><br>${error.message}<br><br>
            ${error.message.includes('Invalid') ?
              'Password is incorrect. Use the "Send Password Reset" button to reset it.' :
              'Please check your credentials and try again.'}`, 'error');
          return;
        }

        if (data.session) {
          showResult(`✅ <strong>Sign In Successful!</strong><br><br>
            Welcome back! Your session is active.<br>
            User ID: ${data.user.id}<br>
            Email: ${data.user.email}<br><br>
            <strong>🎉 You can now go to the main site and you'll be logged in!</strong><br>
            <a href="/" style="color: #667eea; font-weight: 600;">Go to SouvenirPickers →</a>`, 'success');
        }
      } catch (error) {
        showResult(`❌ Unexpected error: ${error.message}`, 'error');
      }
    }

    async function resetPassword() {
      clearResults();
      const email = document.getElementById('email').value;

      if (!email) {
        showResult('❌ Please enter an email address', 'error');
        return;
      }

      showResult('📧 Sending password reset email...', 'info');

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://souvenirpickers.com/reset-password'
        });

        if (error) {
          showResult(`❌ Error: ${error.message}`, 'error');
          return;
        }

        showResult(`✅ <strong>Password Reset Email Sent!</strong><br><br>
          Check your inbox (and spam folder) for an email from SouvenirPickers.<br>
          Click the link in the email to reset your password.<br><br>
          After resetting, you can sign in with your new password.`, 'success');
      } catch (error) {
        showResult(`❌ Unexpected error: ${error.message}`, 'error');
      }
    }
  </script>
</body>
</html>
