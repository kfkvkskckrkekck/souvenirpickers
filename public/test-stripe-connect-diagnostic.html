<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe Connect Diagnostic</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-3xl mx-auto">
    <div class="bg-white rounded-lg shadow-lg p-6">
      <h1 class="text-2xl font-bold text-gray-900 mb-6">Stripe Connect Diagnostic</h1>

      <div class="space-y-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">User Email</label>
          <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg" placeholder="your@email.com" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Access Token</label>
          <textarea id="token" class="w-full px-4 py-2 border border-gray-300 rounded-lg font-mono text-xs" rows="3" placeholder="Paste your Supabase access token here"></textarea>
          <p class="text-xs text-gray-500 mt-1">Get this from localStorage.getItem('supabase.auth.token')</p>
        </div>
      </div>

      <button
        onclick="testStripeConnect()"
        class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
      >
        Test Stripe Connect
      </button>

      <div id="result" class="mt-6"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';

    async function testStripeConnect() {
      const email = document.getElementById('email').value;
      const tokenData = document.getElementById('token').value;
      const resultDiv = document.getElementById('result');

      if (!email || !tokenData) {
        resultDiv.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <p class="text-red-900 font-medium">Please provide both email and access token</p>
          </div>
        `;
        return;
      }

      resultDiv.innerHTML = `
        <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
          <p class="text-blue-900 font-medium">Testing Stripe Connect...</p>
        </div>
      `;

      try {
        // Parse token
        let accessToken;
        try {
          const parsed = JSON.parse(tokenData);
          accessToken = parsed.access_token || parsed.accessToken || tokenData;
        } catch (e) {
          accessToken = tokenData;
        }

        // Test the edge function
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/create-stripe-connect-account`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${accessToken}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email: email,
              country: 'US',
              firstName: 'Test',
              lastName: 'User',
              returnUrl: window.location.href,
              refreshUrl: window.location.href,
            }),
          }
        );

        const responseText = await response.text();
        let result;
        try {
          result = JSON.parse(responseText);
        } catch (e) {
          result = { raw: responseText };
        }

        console.log('Full Response:', {
          status: response.status,
          statusText: response.statusText,
          headers: Object.fromEntries(response.headers.entries()),
          body: result
        });

        if (response.ok && result.success) {
          resultDiv.innerHTML = `
            <div class="bg-green-50 border border-green-200 rounded-lg p-4 space-y-3">
              <div>
                <p class="text-green-900 font-medium text-lg">✓ Success!</p>
                <p class="text-green-800 text-sm mt-1">Stripe Connect is working properly</p>
              </div>
              ${result.accountId ? `
                <div class="bg-white rounded p-3">
                  <p class="text-xs text-gray-600">Account ID</p>
                  <p class="font-mono text-sm">${result.accountId}</p>
                </div>
              ` : ''}
              ${result.onboardingUrl ? `
                <div class="bg-white rounded p-3">
                  <p class="text-xs text-gray-600">Onboarding URL</p>
                  <a href="${result.onboardingUrl}" class="text-blue-600 text-sm underline break-all" target="_blank">Open Onboarding</a>
                </div>
              ` : ''}
              <pre class="bg-white p-3 rounded text-xs overflow-auto">${JSON.stringify(result, null, 2)}</pre>
            </div>
          `;
        } else {
          resultDiv.innerHTML = `
            <div class="bg-red-50 border border-red-200 rounded-lg p-4 space-y-3">
              <div>
                <p class="text-red-900 font-medium text-lg">✗ Error</p>
                <p class="text-red-800 font-medium mt-2">${result.error || 'Unknown error'}</p>
              </div>

              <div class="bg-white rounded p-3">
                <p class="text-xs font-medium text-gray-700 mb-2">Status: ${response.status} ${response.statusText}</p>
              </div>

              <div class="bg-white rounded p-3">
                <p class="text-xs font-medium text-gray-700 mb-2">Common Issues & Solutions:</p>
                <ul class="text-sm space-y-2 text-gray-700">
                  <li>• <strong>Stripe Connect not enabled:</strong> Go to Stripe Dashboard → Settings → Connect and enable it</li>
                  <li>• <strong>Wrong API key:</strong> Make sure you're using the secret key (starts with sk_)</li>
                  <li>• <strong>Test vs Live mode:</strong> Ensure your key matches your intended mode</li>
                  <li>• <strong>Account not verified:</strong> Your Stripe account may need additional verification</li>
                  <li>• <strong>Region restrictions:</strong> Some countries require additional setup</li>
                </ul>
              </div>

              <details class="bg-white rounded p-3">
                <summary class="text-xs font-medium text-gray-700 cursor-pointer">Full Response Details</summary>
                <pre class="text-xs mt-2 overflow-auto">${JSON.stringify({
                  status: response.status,
                  statusText: response.statusText,
                  body: result
                }, null, 2)}</pre>
              </details>
            </div>
          `;
        }
      } catch (error) {
        console.error('Test Error:', error);
        resultDiv.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-lg p-4">
            <p class="text-red-900 font-medium">Network Error</p>
            <p class="text-red-800 text-sm mt-2">${error.message}</p>
            <pre class="bg-white p-3 rounded text-xs mt-3 overflow-auto">${error.stack}</pre>
          </div>
        `;
      }
    }

    // Auto-fill token from localStorage if available
    window.addEventListener('load', () => {
      try {
        const stored = localStorage.getItem('sb-bfqvzxczmvfteqbhgyvx-auth-token');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed.access_token) {
            document.getElementById('token').value = parsed.access_token;
          }
        }
      } catch (e) {
        console.log('Could not auto-fill token:', e);
      }
    });
  </script>
</body>
</html>
