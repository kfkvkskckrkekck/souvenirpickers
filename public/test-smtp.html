<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMTP Test - Password Reset</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #1f2937;
    }
    p {
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    .result.success {
      background: #d1fae5;
      border: 2px solid #10b981;
      color: #065f46;
    }
    .result.error {
      background: #fee2e2;
      border: 2px solid #ef4444;
      color: #991b1b;
    }
    .result h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }
    .result pre {
      background: rgba(0,0,0,0.1);
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      margin-top: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .logs {
      margin-top: 30px;
      background: #f9fafb;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
    }
    .logs h3 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #1f2937;
    }
    .log-entry {
      padding: 10px;
      background: white;
      border-left: 4px solid #667eea;
      margin-bottom: 10px;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }
    .warning {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #92400e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 SMTP Password Reset Test</h1>
    <p>This page will test the password reset email and show you EXACTLY what's happening behind the scenes.</p>

    <div class="warning">
      <strong>⚠️ Important:</strong> Make sure you've added these secrets to your Supabase Dashboard:<br>
      <code>SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM</code>
    </div>

    <input
      type="email"
      id="email"
      placeholder="Enter your email address"
      value=""
    />

    <button onclick="testSecrets()" style="margin-bottom: 15px;">
      🔍 Step 1: Check SMTP Secrets
    </button>

    <button id="testBtn" onclick="testPasswordReset()">
      🚀 Step 2: Test Password Reset Email
    </button>

    <div id="result" class="result"></div>

    <div class="logs">
      <h3>📋 Debug Logs</h3>
      <div id="logs"></div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzMyNDc2ODcsImV4cCI6MjA0ODgyMzY4N30.GzCdHjV_LKHFEWJkN_yYbvxhYFoROSz3w0qH3dEPyWo';

    function addLog(message, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry';
      logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.appendChild(logEntry);
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function testSecrets() {
      const resultDiv = document.getElementById('result');
      document.getElementById('logs').innerHTML = '';

      addLog('🔍 Checking SMTP secrets configuration...');

      try {
        const response = await fetch(`${supabaseUrl}/functions/v1/test-smtp-secret`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        addLog('✅ Secrets check completed');

        resultDiv.style.display = 'block';

        const allFound = Object.values(data.secrets).every(v => v.startsWith('Found:') || v.includes('characters'));

        if (allFound) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✅ All SMTP Secrets Configured!</h3>
            <p>All required SMTP secrets are properly set up in Supabase.</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
            <p style="margin-top: 15px;"><strong>Now proceed to Step 2 to test sending an email.</strong></p>
          `;
          addLog('✅ All secrets are configured correctly');
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>❌ Missing SMTP Secrets!</h3>
            <p>Some SMTP secrets are not configured in Supabase.</p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
            <p style="margin-top: 15px;"><strong>To fix this:</strong></p>
            <ol style="margin-left: 20px;">
              <li>Go to your Supabase Dashboard</li>
              <li>Click "Edge Functions" in the sidebar</li>
              <li>Click "Manage secrets" button</li>
              <li>Add each missing secret listed above</li>
            </ol>
          `;
          addLog('❌ Some secrets are missing!');
        }

      } catch (error) {
        addLog(`❌ Error: ${error.message}`);
        resultDiv.style.display = 'block';
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ Failed to Check Secrets</h3>
          <pre>${error.message}</pre>
        `;
      }
    }

    async function testPasswordReset() {
      const email = document.getElementById('email').value.trim();
      const resultDiv = document.getElementById('result');
      const testBtn = document.getElementById('testBtn');

      resultDiv.style.display = 'none';
      document.getElementById('logs').innerHTML = '';

      if (!email) {
        alert('Please enter an email address');
        return;
      }

      addLog('🚀 Starting password reset test...');
      addLog(`📧 Email: ${email}`);

      testBtn.disabled = true;
      testBtn.textContent = '⏳ Sending...';

      try {
        addLog('🔗 Calling Edge Function: send-password-reset');

        const functionUrl = `${supabaseUrl}/functions/v1/send-password-reset`;
        addLog(`🌐 Function URL: ${functionUrl}`);

        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseAnonKey}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: 'https://souvenirpickers.com/reset-password'
          })
        });

        addLog(`📊 Response Status: ${response.status} ${response.statusText}`);

        const data = await response.json();
        addLog('📦 Response received');

        resultDiv.style.display = 'block';

        if (response.ok) {
          resultDiv.className = 'result success';
          resultDiv.innerHTML = `
            <h3>✅ SUCCESS!</h3>
            <p>Password reset email has been sent to <strong>${email}</strong></p>
            <p><strong>Next steps:</strong></p>
            <ol style="margin-left: 20px; margin-top: 10px;">
              <li>Check your inbox for an email from support@pickersjourney.com</li>
              <li>Also check your SPAM/JUNK folder</li>
              <li>Click the "Reset Password Now" button in the email</li>
            </ol>
            <pre>${JSON.stringify(data, null, 2)}</pre>
          `;
          addLog('✅ Email sent successfully!');
          addLog('📬 Check your inbox and spam folder');
        } else {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <h3>❌ ERROR!</h3>
            <p><strong>The password reset email was NOT sent.</strong></p>
            <p><strong>Error Details:</strong></p>
            <pre>${JSON.stringify(data, null, 2)}</pre>
            <p style="margin-top: 15px;"><strong>Possible causes:</strong></p>
            <ul style="margin-left: 20px;">
              <li>SMTP credentials not configured in Supabase Dashboard</li>
              <li>SMTP server blocking connections from Supabase IPs</li>
              <li>Incorrect SMTP credentials</li>
              <li>Email address doesn't exist in the system</li>
            </ul>
          `;
          addLog(`❌ Error: ${data.error || 'Unknown error'}`);
        }

      } catch (error) {
        addLog(`❌ Exception: ${error.message}`);
        resultDiv.style.display = 'block';
        resultDiv.className = 'result error';
        resultDiv.innerHTML = `
          <h3>❌ CONNECTION ERROR!</h3>
          <p><strong>Failed to connect to the Edge Function.</strong></p>
          <pre>${error.message}</pre>
          <p style="margin-top: 15px;"><strong>This usually means:</strong></p>
          <ul style="margin-left: 20px;">
            <li>Internet connection problem</li>
            <li>Edge Function not deployed</li>
            <li>CORS issue</li>
          </ul>
        `;
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = '🚀 Test Password Reset Email';
      }
    }

    addLog('✅ Test page loaded and ready');
    addLog('💡 Enter your email and click the button to test');
  </script>
</body>
</html>
