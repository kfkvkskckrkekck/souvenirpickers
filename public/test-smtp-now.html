<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMTP Diagnostic Test - SouvenirPickers</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
      border-left: 4px solid #1976d2;
    }

    .status.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #4caf50;
    }

    .status.error {
      background: #ffebee;
      color: #c62828;
      border-left: 4px solid #f44336;
    }

    .results {
      margin-top: 20px;
      display: none;
    }

    .results.show {
      display: block;
    }

    .result-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid #ddd;
    }

    .result-card.success {
      border-left-color: #4caf50;
    }

    .result-card.failed {
      border-left-color: #f44336;
    }

    .result-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-details {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .recommendation {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-weight: 500;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .instructions {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #856404;
    }

    .instructions strong {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 SMTP Diagnostic Test</h1>
    <p class="subtitle">Test which port works best for sending emails via Bluehost SMTP</p>

    <div class="instructions">
      <strong>📧 What This Does:</strong>
      This tool will test both Port 587 (STARTTLS) and Port 465 (SSL) to determine which one successfully sends emails. You will receive test emails for each working port.
    </div>

    <form id="testForm">
      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="your.email@example.com"
          required
        >
      </div>

      <button type="submit" id="submitBtn">
        Run SMTP Diagnostic Test
      </button>
    </form>

    <div id="status" class="status"></div>

    <div id="results" class="results"></div>
  </div>

  <script>
    const form = document.getElementById('testForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    const resultsDiv = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;

      if (!email) {
        showStatus('Please enter your email address', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Testing Both Ports...';
      showStatus('Running SMTP diagnostic tests on Port 587 and Port 465...', 'loading');
      resultsDiv.classList.remove('show');
      resultsDiv.innerHTML = '';

      try {
        const response = await fetch(
          'https://bfqvzxczmvfteqbhgyvx.supabase.co/functions/v1/test-smtp-diagnostic',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ email }),
          }
        );

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }

        displayResults(data);

        if (data.success) {
          showStatus('✅ Diagnostic Complete! Check your email and the results below.', 'success');
        } else {
          showStatus('❌ Both ports failed. Please check the results below.', 'error');
        }

      } catch (error) {
        console.error('Error:', error);
        showStatus(`❌ Error: ${error.message}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run SMTP Diagnostic Test';
      }
    });

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = `status show ${type}`;
    }

    function displayResults(data) {
      let html = '';

      // Port 587 Results
      if (data.results.port587.tested) {
        const success587 = data.results.port587.success;
        html += `
          <div class="result-card ${success587 ? 'success' : 'failed'}">
            <div class="result-title">
              ${success587 ? '✅' : '❌'} Port 587 (STARTTLS)
            </div>
            <div class="result-details">
              ${success587
                ? `<strong>Status:</strong> Working<br>
                   <strong>Message ID:</strong> ${data.results.port587.details.messageId}<br>
                   <strong>Response:</strong> ${data.results.port587.details.response}`
                : `<strong>Status:</strong> Failed<br>
                   <strong>Error:</strong> ${data.results.port587.error}`
              }
            </div>
          </div>
        `;
      }

      // Port 465 Results
      if (data.results.port465.tested) {
        const success465 = data.results.port465.success;
        html += `
          <div class="result-card ${success465 ? 'success' : 'failed'}">
            <div class="result-title">
              ${success465 ? '✅' : '❌'} Port 465 (SSL)
            </div>
            <div class="result-details">
              ${success465
                ? `<strong>Status:</strong> Working<br>
                   <strong>Message ID:</strong> ${data.results.port465.details.messageId}<br>
                   <strong>Response:</strong> ${data.results.port465.details.response}`
                : `<strong>Status:</strong> Failed<br>
                   <strong>Error:</strong> ${data.results.port465.error}`
              }
            </div>
          </div>
        `;
      }

      // Recommendation
      html += `
        <div class="recommendation">
          <strong>📌 Recommendation:</strong><br>
          ${data.recommendation}
        </div>
      `;

      resultsDiv.innerHTML = html;
      resultsDiv.classList.add('show');
    }
  </script>
</body>
</html>
