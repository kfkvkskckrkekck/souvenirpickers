<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      border: 3px solid #ddd;
      border-radius: 10px;
      margin-bottom: 15px;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #output {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border: 3px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 600px;
      overflow-y: auto;
    }
    .success {
      background: #d1fae5;
      border-color: #10b981;
      color: #065f46;
    }
    .error {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }
    .loading {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }
    .step {
      margin: 10px 0;
      padding: 10px;
      background: white;
      border-left: 4px solid #667eea;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Password Reset Test</h1>
    <p class="subtitle">Test the password reset edge function and see the REAL error</p>

    <input
      type="email"
      id="email"
      placeholder="Enter email address (e.g., test@example.com)"
      value="test@example.com"
    />

    <button id="testBtn" onclick="runTest()">🚀 TEST PASSWORD RESET NOW</button>

    <div id="output">Ready to test. Click the button above.</div>
  </div>

  <script>
    const output = document.getElementById('output');
    const testBtn = document.getElementById('testBtn');

    function log(message, isError = false) {
      const timestamp = new Date().toLocaleTimeString();
      const line = `[${timestamp}] ${message}\n`;
      output.textContent += line;
      console.log(message);
      if (isError) console.error(message);
    }

    async function runTest() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        alert('Please enter an email address');
        return;
      }

      output.textContent = '';
      output.className = 'loading';
      testBtn.disabled = true;

      try {
        log('═══════════════════════════════════════════');
        log('🔍 STARTING PASSWORD RESET TEST');
        log('═══════════════════════════════════════════');
        log('');
        log(`📧 Email: ${email}`);
        log('');

        const supabaseUrl = 'https://pynvqvlqecpxxrgmvdfy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bnZxdmxxZWNweHhyZ212ZGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg3MzQ0ODUsImV4cCI6MjA0NDMxMDQ4NX0.TxL-1c3Sxv7ZMWQ5oWwZ0RumBAW5sZFT9ePnXxKCqEo';
        const functionUrl = `${supabaseUrl}/functions/v1/send-password-reset`;

        log('🌐 Endpoint: ' + functionUrl);
        log('');
        log('📤 Sending request...');

        const startTime = Date.now();

        const response = await fetch(functionUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${supabaseKey}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: window.location.origin + '/reset-password',
          }),
        });

        const elapsed = Date.now() - startTime;
        log('');
        log(`⏱️  Request completed in ${elapsed}ms`);
        log(`📊 HTTP Status: ${response.status} ${response.statusText}`);
        log('');

        let data;
        try {
          const text = await response.text();
          log('📦 Raw response:');
          log(text);
          log('');
          data = JSON.parse(text);
        } catch (e) {
          log('⚠️  Failed to parse JSON response', true);
          throw new Error('Invalid JSON response from server');
        }

        log('📋 Parsed response:');
        log(JSON.stringify(data, null, 2));
        log('');

        if (response.ok && data.success) {
          log('═══════════════════════════════════════════');
          log('✅ SUCCESS!');
          log('═══════════════════════════════════════════');
          log('');
          log('✓ Password reset email was sent successfully');
          log(`✓ Check inbox for: ${email}`);
          log(`✓ Message ID: ${data.messageId || 'N/A'}`);
          log('');
          log('📬 IMPORTANT: Check your spam/junk folder!');
          output.className = 'success';
        } else {
          log('═══════════════════════════════════════════');
          log('❌ FAILED!');
          log('═══════════════════════════════════════════');
          log('');
          log('🔴 ERROR DETAILS:');
          log(`   Error: ${data.error || 'Unknown error'}`);
          log(`   Details: ${data.details || 'No additional details'}`);
          log('');
          log('🔍 TROUBLESHOOTING:');
          log('   1. Check if SMTP secrets are configured in Supabase');
          log('   2. Check edge function logs in Supabase dashboard');
          log('   3. Verify email address exists in your system');
          log('   4. Check browser console (F12) for more info');
          output.className = 'error';
        }

      } catch (error) {
        log('');
        log('═══════════════════════════════════════════');
        log('💥 EXCEPTION CAUGHT!');
        log('═══════════════════════════════════════════');
        log('');
        log('Error: ' + error.message, true);
        log('');
        if (error.stack) {
          log('Stack trace:');
          log(error.stack);
        }
        output.className = 'error';
      } finally {
        testBtn.disabled = false;
      }
    }

    // Auto-test on page load for convenience
    window.addEventListener('load', () => {
      log('Page loaded. Ready to test.');
      log('Click "TEST PASSWORD RESET NOW" button to begin.');
      log('');
    });
  </script>
</body>
</html>
