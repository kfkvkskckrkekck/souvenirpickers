<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Upload & Playback Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .section {
      margin: 30px 0;
      padding: 20px;
      background: #f7fafc;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
    }
    .status {
      padding: 15px;
      margin: 10px 0;
      border-radius: 6px;
      font-weight: 500;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: transform 0.2s;
      margin: 5px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }
    input[type="file"] {
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      width: 100%;
      margin: 10px 0;
    }
    video {
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      margin: 10px 0;
      background: #000;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }
    .video-card {
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      background: white;
    }
    pre {
      background: #2d3748;
      color: #48bb78;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    .progress {
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎥 Video Upload & Playback Test</h1>
    <p style="color: #718096;">Test video uploads and playback functionality</p>

    <div class="section">
      <h2>📤 Upload New Video</h2>
      <input type="file" id="videoFile" accept="video/mp4,video/webm,video/quicktime" />
      <div id="uploadProgress" class="progress" style="display: none;">
        <div id="uploadProgressBar" class="progress-bar" style="width: 0%;"></div>
      </div>
      <button onclick="uploadVideo()" id="uploadBtn">Upload Video</button>
      <div id="uploadStatus"></div>
    </div>

    <div class="section">
      <h2>📋 Uploaded Videos</h2>
      <button onclick="loadVideos()">Refresh List</button>
      <div id="videosList"></div>
    </div>

    <div class="section">
      <h2>🔍 Bucket Information</h2>
      <button onclick="checkBucketConfig()">Check Bucket Config</button>
      <div id="bucketInfo"></div>
    </div>

    <div class="section">
      <h2>🧪 Test Video Playback</h2>
      <p style="color: #718096;">Enter a video URL to test playback:</p>
      <input type="text" id="testUrl" placeholder="https://..." style="width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 6px;">
      <button onclick="testVideoUrl()">Test Playback</button>
      <div id="testResult"></div>
    </div>
  </div>

  <script>
    const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjgyOTM0MzUsImV4cCI6MjA0Mzg2OTQzNX0.4aEEVCUYH4ZMz0qDdgLgR9iwI7kx40PKiP1HbBBG6oI';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      currentUser = user;

      if (!user) {
        document.getElementById('uploadStatus').innerHTML =
          '<div class="status error">⚠️ You must be logged in to upload videos. Please log in first.</div>';
        document.getElementById('uploadBtn').disabled = true;
      } else {
        document.getElementById('uploadStatus').innerHTML =
          `<div class="status success">✅ Logged in as: ${user.email}</div>`;
        loadVideos();
      }
    }

    async function uploadVideo() {
      const fileInput = document.getElementById('videoFile');
      const file = fileInput.files[0];

      if (!file) {
        showStatus('uploadStatus', 'Please select a video file', 'error');
        return;
      }

      if (!currentUser) {
        showStatus('uploadStatus', 'You must be logged in to upload', 'error');
        return;
      }

      const allowedTypes = ['video/mp4', 'video/webm', 'video/quicktime'];
      if (!allowedTypes.includes(file.type)) {
        showStatus('uploadStatus', `Invalid file type: ${file.type}. Allowed: MP4, WebM, MOV`, 'error');
        return;
      }

      if (file.size > 50 * 1024 * 1024) {
        showStatus('uploadStatus', 'File too large. Max size is 50MB', 'error');
        return;
      }

      try {
        document.getElementById('uploadBtn').disabled = true;
        document.getElementById('uploadProgress').style.display = 'block';

        const fileExt = file.name.split('.').pop();
        const fileName = `${currentUser.id}/${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;

        showStatus('uploadStatus', `Uploading ${file.name} (${(file.size / 1024 / 1024).toFixed(2)}MB)...`, 'info');

        const { data, error } = await supabase.storage
          .from('listing-videos')
          .upload(fileName, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type
          });

        if (error) throw error;

        const { data: urlData } = supabase.storage
          .from('listing-videos')
          .getPublicUrl(data.path);

        document.getElementById('uploadProgressBar').style.width = '100%';

        showStatus('uploadStatus',
          `✅ Upload successful!<br><strong>URL:</strong> <a href="${urlData.publicUrl}" target="_blank">${urlData.publicUrl}</a>`,
          'success');

        setTimeout(() => {
          loadVideos();
          fileInput.value = '';
          document.getElementById('uploadProgress').style.display = 'none';
          document.getElementById('uploadProgressBar').style.width = '0%';
        }, 1000);

      } catch (error) {
        showStatus('uploadStatus', `Upload failed: ${error.message}`, 'error');
        document.getElementById('uploadProgress').style.display = 'none';
      } finally {
        document.getElementById('uploadBtn').disabled = false;
      }
    }

    async function loadVideos() {
      if (!currentUser) {
        showStatus('videosList', 'You must be logged in to view videos', 'error');
        return;
      }

      try {
        showStatus('videosList', 'Loading videos...', 'info');

        const { data, error } = await supabase.storage
          .from('listing-videos')
          .list(currentUser.id, {
            limit: 100,
            sortBy: { column: 'created_at', order: 'desc' }
          });

        if (error) throw error;

        if (!data || data.length === 0) {
          showStatus('videosList', 'No videos found. Upload one to get started!', 'info');
          return;
        }

        let html = `<div class="status success">Found ${data.length} video(s)</div>`;
        html += '<div class="video-grid">';

        for (const file of data) {
          const { data: urlData } = supabase.storage
            .from('listing-videos')
            .getPublicUrl(`${currentUser.id}/${file.name}`);

          html += `
            <div class="video-card">
              <h4 style="margin-top: 0; color: #667eea;">${file.name}</h4>
              <video
                src="${urlData.publicUrl}"
                controls
                preload="metadata"
                playsInline
                crossOrigin="anonymous"
                onError="console.error('Video load error:', event); event.target.parentElement.querySelector('.error-msg').style.display='block';"
                onLoadedMetadata="console.log('Video loaded successfully:', '${file.name}');"
              ></video>
              <div class="error-msg" style="display: none; color: #e53e3e; padding: 10px; background: #fff5f5; border-radius: 4px; margin-top: 10px;">
                ⚠️ Failed to load video
              </div>
              <p style="font-size: 12px; color: #718096; margin: 10px 0;">
                <strong>Size:</strong> ${(file.metadata?.size / 1024 / 1024).toFixed(2)}MB<br>
                <strong>Type:</strong> ${file.metadata?.mimetype || 'unknown'}<br>
                <strong>Created:</strong> ${new Date(file.created_at).toLocaleString()}
              </p>
              <button onclick="deleteVideo('${currentUser.id}/${file.name}')" style="background: #e53e3e; font-size: 14px; padding: 8px 16px;">Delete</button>
            </div>
          `;
        }

        html += '</div>';
        document.getElementById('videosList').innerHTML = html;

      } catch (error) {
        showStatus('videosList', `Failed to load videos: ${error.message}`, 'error');
      }
    }

    async function deleteVideo(path) {
      if (!confirm('Are you sure you want to delete this video?')) return;

      try {
        const { error } = await supabase.storage
          .from('listing-videos')
          .remove([path]);

        if (error) throw error;

        showStatus('videosList', 'Video deleted successfully', 'success');
        setTimeout(() => loadVideos(), 1000);

      } catch (error) {
        showStatus('videosList', `Delete failed: ${error.message}`, 'error');
      }
    }

    async function checkBucketConfig() {
      try {
        showStatus('bucketInfo', 'Checking bucket configuration...', 'info');

        const response = await fetch(`${supabaseUrl}/rest/v1/rpc/get_bucket_info`, {
          headers: {
            'apikey': supabaseKey,
            'Authorization': `Bearer ${supabaseKey}`
          }
        });

        let html = '<div class="status info"><strong>Bucket Status:</strong></div>';
        html += '<pre>';
        html += `Supabase URL: ${supabaseUrl}\n`;
        html += `Bucket: listing-videos\n`;
        html += `Public URL Format: ${supabaseUrl}/storage/v1/object/public/listing-videos/...\n`;
        html += '</pre>';

        // Test if we can fetch from the bucket
        const testUrl = `${supabaseUrl}/storage/v1/object/public/listing-videos/test.mp4`;
        html += `<p style="color: #718096;">Testing bucket access...</p>`;

        try {
          const testResponse = await fetch(testUrl, { method: 'HEAD' });
          html += `<div class="status ${testResponse.ok ? 'success' : 'error'}">`;
          html += `Bucket HTTP Status: ${testResponse.status} ${testResponse.statusText}</div>`;
        } catch (e) {
          html += `<div class="status error">Bucket access test failed: ${e.message}</div>`;
        }

        document.getElementById('bucketInfo').innerHTML = html;

      } catch (error) {
        showStatus('bucketInfo', `Failed to check bucket: ${error.message}`, 'error');
      }
    }

    async function testVideoUrl() {
      const url = document.getElementById('testUrl').value.trim();

      if (!url) {
        showStatus('testResult', 'Please enter a video URL', 'error');
        return;
      }

      let html = '<div class="status info">Testing video playback...</div>';
      html += `<video src="${url}" controls preload="metadata" playsInline crossOrigin="anonymous"
        onError="document.getElementById('testResult').innerHTML += '<div class=\\'status error\\'>❌ Video failed to load</div>';"
        onLoadedMetadata="document.getElementById('testResult').innerHTML += '<div class=\\'status success\\'>✅ Video loaded successfully!</div>';"
      ></video>`;

      document.getElementById('testResult').innerHTML = html;
    }

    function showStatus(elementId, message, type = 'info') {
      document.getElementById(elementId).innerHTML =
        `<div class="status ${type}">${message}</div>`;
    }

    // Initialize on page load
    init();
  </script>
</body>
</html>
