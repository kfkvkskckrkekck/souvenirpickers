<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Payout Insert</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Test Payout Insert</h1>
  <button onclick="testInsert()">Test Insert</button>
  <pre id="output"></pre>

  <script>
    const supabaseUrl = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjc1MzAzODEsImV4cCI6MjA0MzEwNjM4MX0.fTqGXx5m4lIQ4wB0dHpQjKGmZ3qSEzl67zGH9t0_uJY';
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function testInsert() {
      const output = document.getElementById('output');
      output.textContent = 'Testing...\n';

      // Get current user
      const { data: { user }, error: userError } = await supabase.auth.getUser();

      output.textContent += `User: ${JSON.stringify(user, null, 2)}\n\n`;

      if (!user) {
        output.textContent += 'No user logged in. Please log in first.\n';
        return;
      }

      // Try to insert
      const testData = {
        picker_id: user.id,
        bank_name: 'Test Bank',
        bank_account_name: 'Test Account',
        bank_account_number: 'RO49AAAA1B31007593840000',
        bank_swift_code: 'BOFAUS3N',
        country: 'US',
        currency: 'USD'
      };

      output.textContent += `Inserting: ${JSON.stringify(testData, null, 2)}\n\n`;

      const { data, error } = await supabase
        .from('picker_payout_info')
        .upsert(testData, { onConflict: 'picker_id' })
        .select();

      output.textContent += `Result:\n${JSON.stringify({ data, error }, null, 2)}`;
    }
  </script>
</body>
</html>
