<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Password Reset</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 15px;
      transition: all 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 14px;
    }
    .status.success {
      background: #d1fae5;
      border: 2px solid #10b981;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      border: 2px solid #ef4444;
      color: #991b1b;
    }
    .status.info {
      background: #dbeafe;
      border: 2px solid #3b82f6;
      color: #1e40af;
    }
    .logs {
      margin-top: 30px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .logs h3 {
      margin-bottom: 12px;
      color: #333;
      font-size: 16px;
    }
    .log-entry {
      padding: 8px;
      margin-bottom: 8px;
      background: white;
      border-radius: 4px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }
    .log-entry.success {
      border-left: 4px solid #10b981;
    }
    .log-entry.error {
      border-left: 4px solid #ef4444;
    }
    .log-entry.info {
      border-left: 4px solid #3b82f6;
    }
    .test-accounts {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .test-accounts h3 {
      color: #92400e;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .test-accounts ul {
      list-style: none;
      padding-left: 0;
    }
    .test-accounts li {
      color: #78350f;
      font-size: 13px;
      padding: 4px 0;
      cursor: pointer;
      font-family: 'Courier New', monospace;
    }
    .test-accounts li:hover {
      color: #92400e;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Test Password Reset</h1>
    <p class="subtitle">Test the password reset email functionality</p>

    <div class="test-accounts">
      <h3>📋 Test with these existing accounts (click to use):</h3>
      <ul>
        <li onclick="useEmail('yojabag340@gamening.com')">yojabag340@gamening.com</li>
        <li onclick="useEmail('testuser@test.com')">testuser@test.com</li>
        <li onclick="useEmail('ahmedkhan879709@gmail.com')">ahmedkhan879709@gmail.com</li>
      </ul>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter email to test">
    </div>

    <button id="testBtn" onclick="testPasswordReset()">
      Send Password Reset Email
    </button>

    <div id="status"></div>

    <div class="logs">
      <h3>📊 Test Logs</h3>
      <div id="logs"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

    function useEmail(email) {
      document.getElementById('email').value = email;
      addLog('Selected email: ' + email, 'info');
    }

    function addLog(message, type = 'info') {
      const logsDiv = document.getElementById('logs');
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry ${type}`;
      logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsDiv.insertBefore(logEntry, logsDiv.firstChild);
    }

    function showStatus(message, type) {
      const statusDiv = document.getElementById('status');
      statusDiv.className = `status ${type}`;
      statusDiv.innerHTML = message;
    }

    async function testPasswordReset() {
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('testBtn');

      if (!email) {
        showStatus('⚠️ Please enter an email address', 'error');
        addLog('ERROR: No email provided', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      addLog('Starting password reset test...', 'info');
      addLog(`Testing with email: ${email}`, 'info');
      showStatus('⏳ Sending password reset email...', 'info');

      try {
        const url = `${SUPABASE_URL}/functions/v1/send-password-reset-email`;
        addLog(`Calling: ${url}`, 'info');

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${ANON_KEY}`,
          },
          body: JSON.stringify({
            email: email,
            redirectTo: 'https://souvenirpickers.com/reset-password'
          })
        });

        addLog(`Response status: ${response.status}`, response.ok ? 'success' : 'error');

        const data = await response.json();
        addLog(`Response data: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');

        if (response.ok) {
          showStatus(`
            ✅ <strong>Success!</strong><br>
            ${data.message || 'Password reset email sent!'}<br><br>
            <strong>Next steps:</strong><br>
            1. Check the inbox for: <strong>${email}</strong><br>
            2. Look in SPAM/JUNK folder if not in inbox<br>
            3. Click the reset link in the email<br>
            4. Create a new password
          `, 'success');
          addLog('✓ Password reset email sent successfully!', 'success');
          addLog('Check your email inbox and spam folder', 'info');
        } else {
          showStatus(`❌ <strong>Error:</strong> ${data.error || 'Unknown error'}`, 'error');
          addLog(`✗ Error: ${data.error}`, 'error');
        }
      } catch (err) {
        addLog(`✗ Exception: ${err.message}`, 'error');
        showStatus(`❌ <strong>Error:</strong> ${err.message}`, 'error');
        console.error('Full error:', err);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Password Reset Email';
      }
    }

    // Add initial log
    addLog('Test page loaded successfully', 'success');
    addLog('Ready to test password reset', 'info');
  </script>
</body>
</html>
