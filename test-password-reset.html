<!DOCTYPE html>
<html>
<head>
    <title>Test Password Reset</title>
</head>
<body>
    <h1>Test Password Reset</h1>
    <input type="email" id="email" placeholder="Enter email" value="test@example.com">
    <button onclick="testReset()">Test Password Reset</button>
    <div id="result" style="margin-top: 20px; white-space: pre-wrap;"></div>

    <script>
        async function testReset() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');

            resultDiv.textContent = 'Sending request...';

            try {
                const response = await fetch(
                    'https://cmpsvtcyzsfltocmctdt.supabase.co/functions/v1/send-password-reset',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtcHN2dGN5enNmbHRvY21jdGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjc5NTQ2MDEsImV4cCI6MjA0MzUzMDYwMX0.7BuUj-Vf6mVaDJ64sFVJFN-wXaEiNcuRj45c2q-Dob4',
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: email,
                            redirectTo: 'https://www.souvenirpickers.com/reset-password',
                        }),
                    }
                );

                const result = await response.json();

                resultDiv.textContent = JSON.stringify({
                    status: response.status,
                    statusText: response.statusText,
                    data: result
                }, null, 2);
            } catch (error) {
                resultDiv.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
