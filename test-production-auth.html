<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Auth Test - SouvenirPickers</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 10px; }
        h2 { color: #666; font-size: 20px; margin-top: 0; }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #10b981;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #059669; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .logout-btn { background: #ef4444; margin-top: 10px; }
        .logout-btn:hover { background: #dc2626; }
        #resetPasswordBtn { background: #f59e0b; }
        #resetPasswordBtn:hover { background: #d97706; }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
        }
        .divider {
            border-top: 2px solid #e5e7eb;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <h1>🚀 Production Auth Test</h1>
    <p style="color: #666;">Test authentication on souvenirpickers.com</p>

    <div class="test-section">
        <h2>📝 Sign Up Test</h2>
        <input type="email" id="signupEmail" placeholder="Email (e.g., test@example.com)">
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
        <input type="text" id="signupName" placeholder="Full Name">
        <button onclick="testSignup()">Sign Up</button>
        <div id="signupStatus"></div>
    </div>

    <div class="test-section">
        <h2>🔐 Sign In Test</h2>
        <input type="email" id="signinEmail" placeholder="Email">
        <input type="password" id="signinPassword" placeholder="Password">
        <button onclick="testSignin()">Sign In</button>
        <div id="signinStatus"></div>
    </div>

    <div class="test-section">
        <h2>🔑 Password Reset Test</h2>
        <input type="email" id="resetEmail" placeholder="Email">
        <button id="resetPasswordBtn" onclick="testPasswordReset()">Send Reset Email</button>
        <div id="resetStatus"></div>
    </div>

    <div class="test-section">
        <h2>👤 Current Session</h2>
        <button onclick="checkSession()">Check Session</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
        <div id="sessionStatus"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bfqvzxczmvfteqbhgyvx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmcXZ6eGN6bXZmdGVxYmhneXZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ0MTAxODIsImV4cCI6MjA3OTk4NjE4Mn0.2kgZ_VfgN42cs3B-40snDRgThCOVNIJ0BGQ_gdhbzy0';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testSignup() {
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const name = document.getElementById('signupName').value;
            const status = document.getElementById('signupStatus');

            if (!email || !password || !name) {
                status.innerHTML = '<div class="error">❌ Please fill in all fields</div>';
                return;
            }

            status.innerHTML = '<div class="info">⏳ Creating account...</div>';

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            role: 'collector'
                        }
                    }
                });

                if (error) throw error;

                status.innerHTML = `
                    <div class="success">
                        ✅ <strong>Signup Successful!</strong><br>
                        User ID: ${data.user.id}<br>
                        Email: ${data.user.email}<br>
                        <small>You should be logged in now. Try checking your session below.</small>
                    </div>
                `;
            } catch (error) {
                status.innerHTML = `<div class="error">❌ <strong>Signup Failed:</strong><br>${error.message}</div>`;
            }
        }

        async function testSignin() {
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            const status = document.getElementById('signinStatus');

            if (!email || !password) {
                status.innerHTML = '<div class="error">❌ Please fill in email and password</div>';
                return;
            }

            status.innerHTML = '<div class="info">⏳ Signing in...</div>';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                status.innerHTML = `
                    <div class="success">
                        ✅ <strong>Sign In Successful!</strong><br>
                        User ID: ${data.user.id}<br>
                        Email: ${data.user.email}<br>
                        Last Sign In: ${new Date(data.user.last_sign_in_at).toLocaleString()}
                    </div>
                `;
            } catch (error) {
                status.innerHTML = `<div class="error">❌ <strong>Sign In Failed:</strong><br>${error.message}</div>`;
            }
        }

        async function testPasswordReset() {
            const email = document.getElementById('resetEmail').value;
            const status = document.getElementById('resetStatus');

            if (!email) {
                status.innerHTML = '<div class="error">❌ Please enter an email</div>';
                return;
            }

            status.innerHTML = '<div class="info">⏳ Sending reset email...</div>';

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://souvenirpickers.com/reset-password'
                });

                if (error) throw error;

                status.innerHTML = `
                    <div class="success">
                        ✅ <strong>Password reset email sent!</strong><br>
                        Check your inbox at: ${email}<br>
                        <small>The email will come from support@souvenirpickers.com<br>
                        Click the link to reset your password.</small>
                    </div>
                `;
            } catch (error) {
                status.innerHTML = `<div class="error">❌ <strong>Reset Failed:</strong><br>${error.message}</div>`;
            }
        }

        async function checkSession() {
            const status = document.getElementById('sessionStatus');
            status.innerHTML = '<div class="info">⏳ Checking session...</div>';

            try {
                const { data, error } = await supabase.auth.getSession();

                if (error) throw error;

                if (data.session) {
                    status.innerHTML = `
                        <div class="success">
                            ✅ <strong>Active Session Found!</strong><br>
                            User ID: ${data.session.user.id}<br>
                            Email: ${data.session.user.email}<br>
                            Role: ${data.session.user.user_metadata?.role || 'Not set'}<br>
                            Name: ${data.session.user.user_metadata?.full_name || 'Not set'}<br>
                            Expires: ${new Date(data.session.expires_at * 1000).toLocaleString()}
                        </div>
                        <pre>${JSON.stringify(data.session.user, null, 2)}</pre>
                    `;
                } else {
                    status.innerHTML = '<div class="error">❌ No active session. Please sign in.</div>';
                }
            } catch (error) {
                status.innerHTML = `<div class="error">❌ <strong>Error:</strong><br>${error.message}</div>`;
            }
        }

        async function logout() {
            const status = document.getElementById('sessionStatus');
            status.innerHTML = '<div class="info">⏳ Logging out...</div>';

            try {
                const { error } = await supabase.auth.signOut();
                if (error) throw error;

                status.innerHTML = '<div class="success">✅ Logged out successfully!</div>';

                // Clear other status divs
                document.getElementById('signupStatus').innerHTML = '';
                document.getElementById('signinStatus').innerHTML = '';
                document.getElementById('resetStatus').innerHTML = '';
            } catch (error) {
                status.innerHTML = `<div class="error">❌ <strong>Logout Failed:</strong><br>${error.message}</div>`;
            }
        }

        // Check session on load
        window.addEventListener('load', checkSession);
    </script>
</body>
</html>
