<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe Test</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }
    #card-element {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      background: white;
    }
    button {
      background: #0066cc;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0052a3;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    .success {
      color: green;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Stripe Payment Test</h1>
  <p>This is a standalone test to verify Stripe Elements work properly.</p>

  <form id="payment-form">
    <label for="name">Cardholder Name</label>
    <input type="text" id="name" placeholder="John Doe" required>

    <label>Card Details</label>
    <div id="card-element"></div>

    <div id="card-errors" class="error"></div>

    <button type="submit">Test Card Input</button>
  </form>

  <div id="result"></div>

  <script>
    // Replace with your actual publishable key
    const stripe = Stripe('pk_live_51SI5wQFlPbAiVNx2hO266AapZfZLrCQZZOShtSjw3X4U0A7VyzRgMSBEx81psE24t7rnAU4CQVQc3uFoEniyFe4g00HbtBusTH');

    const elements = stripe.elements();
    const cardElement = elements.create('card', {
      style: {
        base: {
          fontSize: '16px',
          color: '#32325d',
          fontFamily: 'system-ui, -apple-system, sans-serif',
          '::placeholder': {
            color: '#aab7c4'
          }
        },
        invalid: {
          color: '#fa755a',
          iconColor: '#fa755a'
        }
      }
    });

    cardElement.mount('#card-element');

    cardElement.on('change', function(event) {
      const displayError = document.getElementById('card-errors');
      if (event.error) {
        displayError.textContent = event.error.message;
      } else {
        displayError.textContent = '';
      }
    });

    const form = document.getElementById('payment-form');
    form.addEventListener('submit', async function(event) {
      event.preventDefault();

      const nameInput = document.getElementById('name');
      const resultDiv = document.getElementById('result');

      resultDiv.innerHTML = '<p>Creating payment method...</p>';

      const {paymentMethod, error} = await stripe.createPaymentMethod({
        type: 'card',
        card: cardElement,
        billing_details: {
          name: nameInput.value
        }
      });

      if (error) {
        resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
      } else {
        resultDiv.innerHTML = `<p class="success">✓ Success! Payment Method ID: ${paymentMethod.id}</p>`;
        console.log('Payment Method:', paymentMethod);
      }
    });

    console.log('Stripe initialized:', stripe);
    console.log('Card element mounted');
  </script>
</body>
</html>
